# docent keys for Helix. Add these tables to ~/.config/helix/config.toml.
# space z r: paste a reference to the selected lines into the harness input.
# space z s: paste the selected text into the harness input.
#
# Helix passes :sh arguments to the shell as typed, after expansion, and has
# no shell-quoting expansion. The single quotes keep the shell from running
# $(...) or `...` in a buffer name, but a buffer name that contains ' is not
# safe with this binding.

[keys.normal.space.z]
r = ":sh docent send ref '%{buffer_name}:%{selection_line_start}-%{selection_line_end}'"
s = ":pipe-to docent send text"

[keys.select.space.z]
r = ":sh docent send ref '%{buffer_name}:%{selection_line_start}-%{selection_line_end}'"
s = ":pipe-to docent send text"
